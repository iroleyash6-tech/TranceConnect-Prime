<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="wh-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="100%" stop-color="#0f1d33"/>
    </linearGradient>
    <linearGradient id="wh-wall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14233c"/>
      <stop offset="50%" stop-color="#1e3252"/>
      <stop offset="100%" stop-color="#162742"/>
    </linearGradient>
    <linearGradient id="wh-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="wh-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="wh-dock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="360" rx="8" fill="url(#wh-sky)"/>

  <!-- Warehouse Main Facility -->
  <polygon points="40,240 40,90 260,50 480,90 560,90 560,240" fill="url(#wh-wall)"/>
  <polygon points="35,90 260,45 485,90" fill="url(#wh-roof)" stroke="#38bdf8" stroke-width="2"/>
  <line x1="40" y1="90" x2="560" y2="90" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>

  <!-- Warehouse Exterior Panels -->
  <line x1="120" y1="80" x2="120" y2="240" stroke="#0f172a" stroke-width="2"/>
  <line x1="200" y1="65" x2="200" y2="240" stroke="#0f172a" stroke-width="2"/>
  <line x1="280" y1="65" x2="280" y2="240" stroke="#0f172a" stroke-width="2"/>
  <line x1="360" y1="75" x2="360" y2="240" stroke="#0f172a" stroke-width="2"/>
  <line x1="440" y1="85" x2="440" y2="240" stroke="#0f172a" stroke-width="2"/>

  <!-- High-Bay Windows with Illuminated Glow -->
  <rect x="70" y="105" width="40" height="15" rx="2" fill="#38bdf8" opacity="0.35"/>
  <rect x="150" y="105" width="40" height="15" rx="2" fill="#38bdf8" opacity="0.35"/>
  <rect x="230" y="105" width="40" height="15" rx="2" fill="#38bdf8" opacity="0.35"/>
  <rect x="310" y="105" width="40" height="15" rx="2" fill="#38bdf8" opacity="0.35"/>
  <rect x="390" y="105" width="40" height="15" rx="2" fill="#38bdf8" opacity="0.35"/>
  <rect x="470" y="105" width="40" height="15" rx="2" fill="#38bdf8" opacity="0.35"/>

  <!-- Loading Docks (Bays 01, 02, 03, 04) -->
  <!-- Dock 1 -->
  <rect x="70" y="150" width="75" height="90" rx="3" fill="url(#wh-dock)" stroke="#334155" stroke-width="1.5"/>
  <rect x="75" y="155" width="65" height="40" fill="#0284c7" opacity="0.8"/>
  <text x="107" y="142" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="middle" font-weight="bold">BAY 01</text>
  <!-- Dock 2 with Truck Docked -->
  <rect x="180" y="150" width="75" height="90" rx="3" fill="url(#wh-dock)" stroke="#00f0ff" stroke-width="1.5"/>
  <rect x="185" y="170" width="65" height="70" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <line x1="185" y1="190" x2="250" y2="190" stroke="#334155"/>
  <line x1="185" y1="210" x2="250" y2="210" stroke="#334155"/>
  <text x="217" y="142" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="middle" font-weight="bold">BAY 02</text>
  <circle cx="217" cy="160" r="3" fill="#10b981"/>
  <!-- Dock 3 -->
  <rect x="290" y="150" width="75" height="90" rx="3" fill="url(#wh-dock)" stroke="#334155" stroke-width="1.5"/>
  <rect x="295" y="155" width="65" height="60" fill="#0369a1" opacity="0.7"/>
  <text x="327" y="142" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="middle" font-weight="bold">BAY 03</text>
  <!-- Dock 4 -->
  <rect x="400" y="150" width="75" height="90" rx="3" fill="url(#wh-dock)" stroke="#334155" stroke-width="1.5"/>
  <rect x="405" y="155" width="65" height="45" fill="#0284c7" opacity="0.8"/>
  <text x="437" y="142" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="middle" font-weight="bold">BAY 04</text>

  <!-- Ground Tarmac & Markings -->
  <rect x="0" y="240" width="600" height="120" fill="#090e17"/>
  <line x1="0" y1="240" x2="600" y2="240" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  
  <!-- Yellow Dock Safety Staging Lines -->
  <line x1="60" y1="260" x2="155" y2="260" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="170" y1="260" x2="265" y2="260" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="280" y1="260" x2="375" y2="260" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="390" y1="260" x2="485" y2="260" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Forklift Operating in Apron -->
  <rect x="360" y="280" width="35" height="20" rx="3" fill="#f59e0b"/>
  <rect x="350" y="270" width="12" height="30" rx="2" fill="#1e293b"/>
  <line x1="345" y1="298" x2="345" y2="275" stroke="#38bdf8" stroke-width="2"/>
  <line x1="338" y1="298" x2="345" y2="298" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="365" cy="303" r="5" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <circle cx="390" cy="303" r="5" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <!-- Pallet on Forklift -->
  <rect x="328" y="285" width="16" height="13" fill="#854d0e"/>
  <line x1="328" y1="290" x2="344" y2="290" stroke="#ca8a04"/>

  <!-- Signage -->
  <text x="260" y="80" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#00f0ff" text-anchor="middle" letter-spacing="3">TRANCECONNECT AUTOMATED LOGISTICS HUB</text>
  <text x="260" y="93" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#94a3b8" text-anchor="middle" letter-spacing="1">CENTRAL INVENTORY CONSOLIDATION & MULTIMODAL FREIGHT TERMINAL</text>
</svg>
