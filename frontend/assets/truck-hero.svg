<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" fill="none">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="20" y="30" width="180" height="70" rx="4" fill="url(#body-grad)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="25" y="35" width="170" height="60" rx="2" fill="#0b1322"/>
  
  <!-- Container Grooves -->
  <line x1="45" y1="35" x2="45" y2="95" stroke="#1e293b" stroke-width="2"/>
  <line x1="65" y1="35" x2="65" y2="95" stroke="#1e293b" stroke-width="2"/>
  <line x1="85" y1="35" x2="85" y2="95" stroke="#1e293b" stroke-width="2"/>
  <line x1="105" y1="35" x2="105" y2="95" stroke="#1e293b" stroke-width="2"/>
  <line x1="125" y1="35" x2="125" y2="95" stroke="#1e293b" stroke-width="2"/>
  <line x1="145" y1="35" x2="145" y2="95" stroke="#1e293b" stroke-width="2"/>
  <line x1="165" y1="35" x2="165" y2="95" stroke="#1e293b" stroke-width="2"/>

  <!-- Brand Decal on Trailer -->
  <text x="110" y="68" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#38bdf8" text-anchor="middle" letter-spacing="2">TRANCECONNECT</text>
  <text x="110" y="80" font-family="'Inter', sans-serif" font-weight="700" font-size="7" fill="#00f0ff" text-anchor="middle" letter-spacing="1">PRIME EXPRESS FREIGHT</text>

  <!-- Cabin Body -->
  <path d="M200,50 L240,50 L265,70 L280,70 L285,100 L200,100 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <!-- Cabin Windshield -->
  <path d="M238,54 L260,70 L235,70 Z" fill="#bae6fd" opacity="0.85"/>
  <rect x="220" y="55" width="14" height="15" fill="#38bdf8" opacity="0.6"/>

  <!-- Headlight beam -->
  <polygon points="285,82 320,70 320,110 285,92" fill="url(#glow-cyan)" opacity="0.35" filter="url(#neon-glow)"/>
  <circle cx="282" cy="86" r="4" fill="#00f0ff" filter="url(#neon-glow)"/>

  <!-- Undercarriage Chassis -->
  <rect x="30" y="98" width="245" height="6" fill="#475569"/>

  <!-- Wheels with Glowing Rims -->
  <!-- Trailer Wheels -->
  <g class="wheel">
    <circle cx="50" cy="108" r="14" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <circle cx="50" cy="108" r="6" fill="#38bdf8"/>
  </g>
  <g class="wheel">
    <circle cx="82" cy="108" r="14" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <circle cx="82" cy="108" r="6" fill="#38bdf8"/>
  </g>

  <!-- Drive Wheels -->
  <g class="wheel">
    <circle cx="175" cy="108" r="14" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <circle cx="175" cy="108" r="6" fill="#38bdf8"/>
  </g>
  <g class="wheel">
    <circle cx="205" cy="108" r="14" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <circle cx="205" cy="108" r="6" fill="#38bdf8"/>
  </g>

  <!-- Steering Wheel -->
  <g class="wheel">
    <circle cx="265" cy="108" r="14" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <circle cx="265" cy="108" r="6" fill="#00f0ff"/>
  </g>
</svg>
