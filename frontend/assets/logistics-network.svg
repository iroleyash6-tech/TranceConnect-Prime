<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="net-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="100%" stop-color="#0b1728"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="360" rx="8" fill="url(#net-bg)"/>

  <!-- World / Regional Map Contour Grids -->
  <g opacity="0.15">
    <circle cx="300" cy="180" r="140" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="300" cy="180" r="100" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="300" cy="180" r="60" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="100" y1="180" x2="500" y2="180" stroke="#38bdf8" stroke-width="1"/>
    <line x1="300" y1="40" x2="300" y2="320" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Network Interconnection Corridors (Highways) -->
  <!-- Delhi to Mumbai -->
  <line x1="280" y1="110" x2="220" y2="210" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="8 4"/>
  <!-- Mumbai to Pune / Chakan -->
  <line x1="220" y1="210" x2="250" y2="240" stroke="#10b981" stroke-width="3"/>
  <!-- Mumbai to JNPT -->
  <line x1="220" y1="210" x2="210" y2="225" stroke="#38bdf8" stroke-width="3"/>
  <!-- Delhi to Kolkata -->
  <line x1="280" y1="110" x2="410" y2="170" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6 3"/>
  <!-- Mumbai to Bengaluru -->
  <line x1="220" y1="210" x2="290" y2="290" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="8 4"/>
  <!-- Bengaluru to Chennai -->
  <line x1="290" y1="290" x2="350" y2="280" stroke="#10b981" stroke-width="2.5"/>
  <!-- Kolkata to Chennai (East Coast) -->
  <line x1="410" y1="170" x2="350" y2="280" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3"/>
  <!-- Delhi to Ahmedabad / Mundra Port -->
  <line x1="280" y1="110" x2="180" y2="170" stroke="#00f0ff" stroke-width="2"/>
  <line x1="180" y1="170" x2="220" y2="210" stroke="#00f0ff" stroke-width="2"/>

  <!-- Satellite Telemetry Beams -->
  <g transform="translate(470, 70)">
    <!-- Satellite Body -->
    <rect x="-10" y="-8" width="20" height="16" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-28" y1="0" x2="-10" y2="0" stroke="#00f0ff" stroke-width="2"/>
    <line x1="10" y1="0" x2="28" y2="0" stroke="#00f0ff" stroke-width="2"/>
    <rect x="-35" y="-12" width="7" height="24" rx="1" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <rect x="28" y="-12" width="7" height="24" rx="1" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="0" cy="0" r="3" fill="#00f0ff"/>
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="7" fill="#38bdf8" text-anchor="middle">NAV-SAT 04</text>
  </g>
  <!-- Beam Down to Hub -->
  <line x1="470" y1="80" x2="220" y2="210" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="470" y1="80" x2="280" y2="110" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Hub Nodes -->
  <!-- Delhi NCR -->
  <circle cx="280" cy="110" r="16" fill="url(#node-glow)"/>
  <circle cx="280" cy="110" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
  <text x="280" y="95" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#f1f5f9" text-anchor="middle">DELHI NCR HUB</text>

  <!-- Mumbai / JNPT -->
  <circle cx="220" cy="210" r="22" fill="url(#node-glow)"/>
  <circle cx="220" cy="210" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <text x="170" y="215" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#00f0ff" text-anchor="end">JNPT / MUMBAI HQ</text>

  <!-- Pune Auto Cluster -->
  <circle cx="250" cy="240" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <text x="260" y="244" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#94a3b8">CHAKAN MIDC</text>

  <!-- Ahmedabad / Mundra -->
  <circle cx="180" cy="170" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <text x="135" y="174" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#94a3b8">AHMEDABAD</text>

  <!-- Kolkata -->
  <circle cx="410" cy="170" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5"/>
  <text x="445" y="174" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#94a3b8">KOLKATA PORT</text>

  <!-- Bengaluru Tech Hub -->
  <circle cx="290" cy="290" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="1.5"/>
  <text x="290" y="310" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#94a3b8" text-anchor="middle">BENGALURU HUB</text>

  <!-- Chennai Port -->
  <circle cx="350" cy="280" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <text x="390" y="284" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#94a3b8">CHENNAI</text>

  <!-- Live Pulse Animation Rings -->
  <circle cx="220" cy="210" r="14" stroke="#00f0ff" stroke-width="1" opacity="0.8"/>
  <circle cx="280" cy="110" r="12" stroke="#00f0ff" stroke-width="1" opacity="0.8"/>

  <!-- Legend / Header -->
  <text x="300" y="42" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#00f0ff" text-anchor="middle" letter-spacing="2">PAN-INDIA FREIGHT TELEMATICS NETWORK</text>
  <text x="300" y="58" font-family="'Inter', sans-serif" font-weight="500" font-size="9" fill="#94a3b8" text-anchor="middle">50,000+ KM MONITORED HIGHWAYS &bull; AUTOMATED WEIGHBRIDGE & GPS INTEGRATION</text>
</svg>
