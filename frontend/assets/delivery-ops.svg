<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="ops-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07101e"/>
      <stop offset="100%" stop-color="#0f1b2d"/>
    </linearGradient>
    <linearGradient id="ops-van" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="scanner-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="8" fill="url(#ops-bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="280" x2="600" y2="280" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>
  <rect x="0" y="280" width="600" height="80" fill="#090d16"/>

  <!-- Sorting Conveyor Line -->
  <rect x="40" y="210" width="220" height="15" rx="3" fill="#1e293b" stroke="#334155"/>
  <line x1="50" y1="225" x2="50" y2="280" stroke="#334155" stroke-width="3"/>
  <line x1="150" y1="225" x2="150" y2="280" stroke="#334155" stroke-width="3"/>
  <line x1="250" y1="225" x2="250" y2="280" stroke="#334155" stroke-width="3"/>

  <!-- Packages on Conveyor with Barcodes & QR labels -->
  <!-- Box 1 -->
  <rect x="60" y="175" width="40" height="35" rx="2" fill="#b45309" stroke="#d97706" stroke-width="1.5"/>
  <rect x="65" y="180" width="16" height="10" fill="#fef3c7"/>
  <line x1="68" y1="183" x2="78" y2="183" stroke="#000" stroke-width="1"/>
  <line x1="68" y1="186" x2="78" y2="186" stroke="#000" stroke-width="1"/>
  <!-- Box 2 (Being Scanned) -->
  <rect x="120" y="165" width="50" height="45" rx="2" fill="#d97706" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="130" y="175" width="22" height="14" fill="#ffffff"/>
  <line x1="133" y1="178" x2="149" y2="178" stroke="#000" stroke-width="1.5"/>
  <line x1="133" y1="182" x2="149" y2="182" stroke="#000" stroke-width="1.5"/>
  <line x1="133" y1="186" x2="149" y2="186" stroke="#000" stroke-width="1.5"/>
  <!-- Scanner Beam -->
  <polygon points="145,110 120,165 170,165" fill="url(#scanner-beam)"/>
  <line x1="120" y1="175" x2="170" y2="175" stroke="#10b981" stroke-width="2"/>
  <!-- Ceiling Telemetry Sensor -->
  <rect x="135" y="90" width="20" height="20" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="145" cy="100" r="4" fill="#10b981"/>

  <!-- Box 3 -->
  <rect x="195" y="180" width="45" height="30" rx="2" fill="#92400e" stroke="#b45309" stroke-width="1.5"/>

  <!-- Express Last-Mile Van on the Right -->
  <!-- Van Body -->
  <rect x="310" y="150" width="190" height="100" rx="6" fill="url(#ops-van)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Van Nose/Cabin -->
  <path d="M500,180 L545,180 L560,215 L560,250 L500,250 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <!-- Windshield -->
  <polygon points="505,185 538,185 550,215 505,215" fill="#bae6fd" opacity="0.85"/>
  <line x1="500" y1="150" x2="500" y2="250" stroke="#0f172a" stroke-width="2"/>
  <!-- Side Graphic on Van -->
  <line x1="320" y1="200" x2="480" y2="200" stroke="#00f0ff" stroke-width="2"/>
  <text x="400" y="185" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">TRANCECONNECT EXPRESS</text>
  <text x="400" y="215" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a5f3fc" text-anchor="middle">SAME-DAY DISPATCH SLA</text>
  <!-- Rear Door Seam -->
  <line x1="340" y1="150" x2="340" y2="250" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Wheels -->
  <circle cx="360" cy="255" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="360" cy="255" r="10" fill="#334155"/>
  <circle cx="510" cy="255" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="510" cy="255" r="10" fill="#334155"/>

  <!-- Driver / Dispatcher with Digital Tablet -->
  <!-- Body -->
  <rect x="260" y="185" width="22" height="55" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
  <!-- Head -->
  <circle cx="271" cy="170" r="9" fill="#e2e8f0"/>
  <!-- Safety Vest -->
  <path d="M260,195 L282,195 L282,215 L260,215 Z" fill="#f59e0b"/>
  <line x1="265" y1="195" x2="265" y2="215" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="277" y1="195" x2="277" y2="215" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Tablet -->
  <rect x="250" y="200" width="16" height="22" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <rect x="252" y="203" width="12" height="14" fill="#00f0ff" opacity="0.8"/>

  <!-- Header Info -->
  <text x="300" y="45" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#00f0ff" text-anchor="middle" letter-spacing="2">LAST-MILE & DISTRIBUTION OPERATIONS</text>
  <text x="300" y="62" font-family="'Inter', sans-serif" font-weight="500" font-size="9" fill="#94a3b8" text-anchor="middle">REAL-TIME BARCODE SORTING, E-WAY BILL VALIDATION & RAPID DEPLOYMENT</text>
</svg>
