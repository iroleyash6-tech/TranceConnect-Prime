    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <ellipse cx="360" cy="340" rx="300" ry="20" fill="#000" opacity="0.4"/>
