    <g transform="translate(210, 296)"><circle cx="0" cy="0" r="32" fill="#090d16"/><circle cx="0" cy="0" r="16" fill="#cbd5e1"/><circle cx="0" cy="0" r="6" fill="#000"/></g>
    <g transform="translate(370, 296)"><circle cx="0" cy="0" r="32" fill="#090d16"/><circle cx="0" cy="0" r="16" fill="#cbd5e1"/><circle cx="0" cy="0" r="6" fill="#000"/></g>
    <g transform="translate(565, 296)"><circle cx="0" cy="0" r="32" fill="#090d16"/><circle cx="0" cy="0" r="16" fill="#cbd5e1"/><circle cx="0" cy="0" r="6" fill="#000"/></g>
  </g>
