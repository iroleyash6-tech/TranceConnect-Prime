<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="tc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Hexagon Icon -->
  <g transform="translate(6, 4)">
    <polygon points="20,2 38,12 38,32 20,42 2,32 2,12" stroke="url(#tc-grad)" stroke-width="2.5" fill="rgba(0, 240, 255, 0.08)" />
    <!-- Truck Cabin inside hexagon -->
    <path d="M10,24 L14,16 L24,16 L28,24 L30,24 L30,28 L10,28 Z" fill="#00f0ff" />
    <circle cx="15" cy="28" r="2.5" fill="#ffffff" />
    <circle cx="25" cy="28" r="2.5" fill="#ffffff" />
    <circle cx="20" cy="10" r="1.5" fill="#00f0ff" filter="url(#glow)" />
  </g>
  <!-- Brand Text -->
  <text x="54" y="27" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="0.5">TRANCE<tspan fill="url(#tc-grad)">CONNECT</tspan></text>
  <text x="55" y="40" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="9" fill="#00f0ff" letter-spacing="2.8">PRIME LOGISTICS</text>
</svg>
