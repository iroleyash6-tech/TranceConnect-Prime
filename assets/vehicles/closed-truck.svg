<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="cabGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="350" cy="340" rx="300" ry="20" fill="#000" opacity="0.4" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- Chassis -->
    <rect x="80" y="272" width="540" height="20" rx="3" fill="#1e293b"/>

    <!-- High-Capacity Closed Insulated Box -->
    <rect x="75" y="95" width="375" height="175" rx="8" fill="url(#boxGrad)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Cyber Decal Stripe -->
    <path d="M 75 180 L 450 180 L 450 205 L 75 205 Z" fill="#0284c7"/>
    <path d="M 75 205 L 450 205 L 450 215 L 75 215 Z" fill="#38bdf8"/>
    <!-- Side Cargo Shutter / Access Door -->
    <rect x="180" y="115" width="60" height="150" rx="3" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="190" cy="190" r="3" fill="#334155"/>
    <!-- Fleet Identification -->
    <text x="100" y="150" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20">EXPRESS FREIGHT</text>
    <text x="100" y="170" fill="#64748b" font-family="sans-serif" font-weight="bold" font-size="11">TAMPER-PROOF &bull; GPS MONITORED</text>

    <!-- Cabin Cabover -->
    <path d="M 450 145 L 485 105 L 565 105 L 595 185 L 610 280 L 450 280 Z" fill="url(#cabGrad2)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Windshield -->
    <path d="M 505 115 L 555 115 L 585 185 L 525 185 Z" fill="#38bdf8" opacity="0.85"/>
    <line x1="520" y1="125" x2="570" y2="180" stroke="#fff" stroke-width="3" opacity="0.6"/>
    <!-- Headlights -->
    <polygon points="598,255 612,255 608,272 594,272" fill="#00f0ff" filter="url(#glow)"/>

    <!-- Mudguards -->
    <path d="M 120 290 A 35 35 0 0 1 190 290" fill="#0f172a"/>
    <path d="M 330 290 A 35 35 0 0 1 400 290" fill="#0f172a"/>
    <path d="M 520 290 A 35 35 0 0 1 590 290" fill="#0f172a"/>

    <!-- Wheels -->
    <g transform="translate(155, 298)">
      <circle cx="0" cy="0" r="32" fill="#090d16" stroke="#334155" stroke-width="4"/>
      <circle cx="0" cy="0" r="20" fill="#cbd5e1"/><circle cx="0" cy="0" r="8" fill="#0f172a"/>
    </g>
    <g transform="translate(365, 298)">
      <circle cx="0" cy="0" r="32" fill="#090d16" stroke="#334155" stroke-width="4"/>
      <circle cx="0" cy="0" r="20" fill="#cbd5e1"/><circle cx="0" cy="0" r="8" fill="#0f172a"/>
    </g>
    <g transform="translate(555, 298)">
      <circle cx="0" cy="0" r="32" fill="#090d16" stroke="#334155" stroke-width="4"/>
      <circle cx="0" cy="0" r="20" fill="#cbd5e1"/><circle cx="0" cy="0" r="8" fill="#0f172a"/>
    </g>
  </g>
</svg>