<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <ellipse cx="350" cy="340" rx="300" ry="20" fill="#000" opacity="0.4"/>
  <g filter="url(#shadow)">
    <!-- Heavy Chassis -->
    <rect x="75" y="265" width="550" height="24" fill="#1e293b" rx="4"/>
    <!-- Open Body High Sides (Dropside Timber/Steel) -->
    <rect x="70" y="160" width="395" height="105" rx="4" fill="url(#bodyGrad)" stroke="#78350f" stroke-width="2"/>
    <!-- Vertical Support Stakes -->
    <path d="M 120 160 L 120 265 M 180 160 L 180 265 M 240 160 L 240 265 M 300 160 L 300 265 M 360 160 L 360 265 M 420 160 L 420 265" stroke="#78350f" stroke-width="5"/>
    <!-- Tarpaulin Covered Bulk Cargo Stack Peeking Out -->
    <path d="M 90 160 Q 200 100 300 130 Q 400 110 450 160 Z" fill="#0f766e" stroke="#042f2e" stroke-width="2"/>
    <text x="140" y="215" fill="#fff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16" letter-spacing="2">HEAVY BULK FREIGHT</text>

    <!-- Heavy Conventional Cabin -->
    <path d="M 465 170 L 490 120 L 565 120 L 585 180 L 615 190 L 625 285 L 465 285 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 505 130 L 550 130 L 575 180 L 520 180 Z" fill="#38bdf8" opacity="0.8"/>
    <!-- Vertical Chrome Exhaust Stack -->
    <rect x="472" y="70" width="10" height="100" rx="3" fill="#cbd5e1" stroke="#475569"/>
    <path d="M 472 70 Q 465 60 455 60" stroke="#cbd5e1" stroke-width="8" fill="none"/>
    <!-- Headlight -->
    <circle cx="615" cy="245" r="10" fill="#fef08a"/>

    <!-- Wheels (Multi-Axle Heavy Duty) -->
    <g transform="translate(135, 296)"><circle cx="0" cy="0" r="32" fill="#090d16"/><circle cx="0" cy="0" r="18" fill="#94a3b8"/><circle cx="0" cy="0" r="7" fill="#000"/></g>
    <g transform="translate(210, 296)"><circle cx="0" cy="0" r="32" fill="#090d16"/><circle cx="0" cy="0" r="18" fill="#94a3b8"/><circle cx="0" cy="0" r="7" fill="#000"/></g>
    <g transform="translate(380, 296)"><circle cx="0" cy="0" r="32" fill="#090d16"/><circle cx="0" cy="0" r="18" fill="#94a3b8"/><circle cx="0" cy="0" r="7" fill="#000"/></g>
    <g transform="translate(560, 296)"><circle cx="0" cy="0" r="32" fill="#090d16"/><circle cx="0" cy="0" r="18" fill="#94a3b8"/><circle cx="0" cy="0" r="7" fill="#000"/></g>
  </g>
</svg>