<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <linearGradient id="vanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <ellipse cx="350" cy="330" rx="270" ry="18" fill="#000" opacity="0.4"/>
  <g filter="url(#shadow)">
    <!-- Aerodynamic Electric Van Hull -->
    <path d="M 120 270 L 120 140 Q 120 120 150 120 L 460 120 Q 530 120 570 190 L 590 270 Z" fill="url(#vanGrad)" stroke="#34d399" stroke-width="2"/>
    <!-- Windshield & Front Side Glass -->
    <path d="M 455 130 L 510 130 L 560 190 L 460 190 Z" fill="#38bdf8" opacity="0.85"/>
    <path d="M 390 130 L 445 130 L 445 190 L 390 190 Z" fill="#38bdf8" opacity="0.85"/>
    <!-- Headlight Blade -->
    <polygon points="570,230 588,230 585,245 565,245" fill="#00f0ff"/>
    <text x="180" y="200" fill="#fff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="22">ZERO EMISSION</text>
    <text x="180" y="225" fill="#d1fae5" font-family="sans-serif" font-weight="bold" font-size="12">EXPRESS LAST-MILE LOGISTICS</text>
    <!-- Wheels -->
    <g transform="translate(200, 280)"><circle cx="0" cy="0" r="32" fill="#090d16"/><circle cx="0" cy="0" r="16" fill="#cbd5e1"/><circle cx="0" cy="0" r="6" fill="#000"/></g>
    <g transform="translate(490, 280)"><circle cx="0" cy="0" r="32" fill="#090d16"/><circle cx="0" cy="0" r="16" fill="#cbd5e1"/><circle cx="0" cy="0" r="6" fill="#000"/></g>
  </g>
</svg>